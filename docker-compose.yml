services:
  postgres:
    image: postgres:16-alpine
    container_name: dineflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dineflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dineflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dineflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dineflow} -d ${POSTGRES_DB:-dineflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dineflow-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dineflow}:${POSTGRES_PASSWORD:-dineflow_dev_password}@postgres:5432/${POSTGRES_DB:-dineflow}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5"
    networks:
      - dineflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dineflow-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Browser calls the API via host-mapped port
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:8000}
      # SSR inside the frontend container must use the Docker service name
      NUXT_API_URL: ${NUXT_API_URL:-http://backend:8000}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    networks:
      - dineflow

volumes:
  postgres_data:

networks:
  dineflow:
    driver: bridge
