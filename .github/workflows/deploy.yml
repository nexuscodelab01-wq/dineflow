name: Deploy

# Deploys happen only when YOU start one: GitHub → Actions → Deploy → Run workflow, then pick where (qa or prod) and,
# optionally, which version (a tag, branch or commit). Nothing deploys on a push or a merge.
#
# Branches: `dev` is where changes are tried (it is what QA runs); `main` only ever holds versions that already worked on
# QA, and it is what production runs.
# - qa:   deploys that version to QA (blank = the latest `dev`). Any branch, tag or commit is allowed — it is the test bench.
# - prod: deploys it to production (blank = the latest `main`), but only if that exact commit is ON `main` and passed CI,
#         and — once you add required reviewers to the "prod" environment in Settings → Environments — only after
#         an Approve click. scripts/deploy.sh on the server takes a database backup first and stops if it fails.
#
# Secrets (Settings → Secrets and variables → Actions): QA_HOST, QA_USER, QA_SSH_KEY, QA_PATH and
# PROD_HOST, PROD_USER, PROD_SSH_KEY, PROD_PATH. QA runs on the production server, so the HOST values can be the same.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [qa, prod]
        default: qa
      ref:
        description: Version to deploy — tag, branch or commit (blank = latest dev for qa, latest main for prod)
        required: false

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Check what is being deployed
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the version to an exact commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          REF: ${{ github.event.inputs.ref || (github.event.inputs.environment == 'prod' && 'main' || 'dev') }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq .sha) || { echo "::error::Could not find '${REF}' in this repository."; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying ${REF} = ${SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require that the commit is on main (production only)
        if: github.event.inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # "behind" or "identical" = this commit is already part of main's history, i.e. it was merged there.
          STATE=$(gh api "repos/${{ github.repository }}/compare/main...${SHA}" --jq .status)
          case "$STATE" in
            identical|behind) echo "Commit ${SHA} is on main." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Commit ${SHA} is not on main (it is ${STATE} main). Production only runs what has been merged into main — try it on QA first, then merge dev into main."; exit 1 ;;
          esac

      - name: Require a passing CI run for this commit (production only)
        if: github.event.inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          PASSED=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success" --jq '.total_count')
          if [ "${PASSED:-0}" -lt 1 ]; then
            echo "::error::Commit ${SHA} has no successful CI run. Push it to main (or fix the failing tests) and wait for CI to go green before deploying to production."
            exit 1
          fi
          echo "CI passed for ${SHA}." | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      TARGET: ${{ github.event.inputs.environment }}
      SHA: ${{ needs.verify.outputs.sha }}
      HOST: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_HOST || secrets.QA_HOST }}
      DEPLOY_USER: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_USER || secrets.QA_USER }}
      SSH_KEY: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_SSH_KEY || secrets.QA_SSH_KEY }}
      DEPLOY_PATH: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_PATH || secrets.QA_PATH }}
    steps:
      - name: Deploy over SSH
        run: |
          [ -n "$HOST" ] || { echo "::error::The ${TARGET} server secrets (HOST, USER, SSH_KEY) are not set in Settings → Secrets and variables → Actions."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          CONFIRM=""
          [ "$TARGET" = "prod" ] && CONFIRM="CONFIRM_PROD=yes "
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$HOST" \
            "cd '${DEPLOY_PATH:-/opt/dineflow}' && ${CONFIRM}scripts/deploy.sh ${TARGET} ${SHA}"
          echo "Deployed ${SHA} to ${TARGET}." >> "$GITHUB_STEP_SUMMARY"
