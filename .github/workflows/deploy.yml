name: Deploy

# Every green CI run on main deploys to QA automatically (QA runs on the production server, see docs/OPERATIONS.md). Production is deliberate: run this workflow by hand
# (Actions → Deploy → Run workflow → environment "prod") — and in GitHub → Settings → Environments, give the "prod"
# environment required reviewers so it also needs a second click. Both only work once the secrets below exist; until
# then the jobs skip themselves, so this file is safe to commit before the servers are ready.
#
# Secrets (per environment): QA_HOST / QA_USER / QA_SSH_KEY / QA_PATH and PROD_HOST / PROD_USER / PROD_SSH_KEY / PROD_PATH.
# The deploy itself is scripts/deploy.sh on the server (it backs up production first and checks the API is healthy).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [qa, prod]
        default: qa
      ref:
        description: Git ref to deploy (tag, branch or commit; blank = latest main)
        required: false

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'qa' }}
  cancel-in-progress: false

jobs:
  qa:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa')
    runs-on: ubuntu-latest
    environment: qa
    env:
      HOST: ${{ secrets.QA_HOST }}
      DEPLOY_USER: ${{ secrets.QA_USER }}
      SSH_KEY: ${{ secrets.QA_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.QA_PATH }}
      REF: ${{ github.event.inputs.ref }}
    steps:
      - name: Deploy to QA
        run: |
          [ -n "$HOST" ] || { echo "QA_HOST is not set — skipping."; exit 0; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$HOST" \
            "cd '${DEPLOY_PATH:-/opt/dineflow}' && scripts/deploy.sh qa ${REF:-origin/main}"

  prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      HOST: ${{ secrets.PROD_HOST }}
      DEPLOY_USER: ${{ secrets.PROD_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.PROD_PATH }}
      REF: ${{ github.event.inputs.ref }}
    steps:
      - name: Deploy to production
        run: |
          [ -n "$HOST" ] || { echo "PROD_HOST is not set — nothing deployed."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$HOST" \
            "cd '${DEPLOY_PATH:-/opt/dineflow}' && CONFIRM_PROD=yes scripts/deploy.sh prod ${REF:-origin/main}"
