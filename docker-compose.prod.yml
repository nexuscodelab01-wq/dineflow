# Production Docker Compose stack for DineFlow.
# Usage:
#   cp .env.example .env
#   # Set strong JWT secrets and production URLs in .env
#   docker compose -f docker-compose.prod.yml up --build -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: dineflow-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dineflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dineflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dineflow} -d ${POSTGRES_DB:-dineflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dineflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: dineflow-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dineflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dineflow}
      # Set APP_DB_PASSWORD to make the running app connect as a restricted role (row-level security); empty = not enforced.
      APP_DATABASE_URL: ${APP_DB_PASSWORD:+postgresql+psycopg://dineflow_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-dineflow}}
      ENVIRONMENT: production
      RUN_SEED: ${RUN_SEED:-false}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    # No published port — caddy is the only public entry point; everything else talks to this
    # container over the internal "dineflow" network by its service name.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Ready = the API is up AND can reach the database.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dineflow

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: dineflow-frontend-prod
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # The build ARG above only bakes NUXT_PUBLIC_API_URL into the client bundle — SSR running
      # *inside* this container also needs it at runtime (Nuxt's own NUXT_<KEY> env-override
      # convention), plus the Docker-internal address for its own server-to-server calls to the
      # backend (never the public URL — that's what NUXT_PUBLIC_API_URL is for the browser).
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:8000}
      NUXT_API_URL: ${NUXT_API_URL:-http://backend:8000}
    # No published port — see backend's own comment above.
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - dineflow

  caddy:
    build:
      context: ./caddy
    container_name: dineflow-caddy-prod
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - dineflow

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  dineflow:
    driver: bridge
